<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sotuvchi profili</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #011627;
            --accent: #3a86ff;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text-muted: #64748b;
            --border: rgba(0,0,0,0.05);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background: var(--bg); font-family: -apple-system, system-ui, sans-serif; color: var(--primary); padding-bottom: 100px; }

        .profile-header {
            background: var(--white);
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 32px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 35px;
            object-fit: cover;
            border: 4px solid #f0f7ff;
        }

        .verify-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--white);
            font-size: 14px;
        }

        .profile-name { font-size: 1.4rem; font-weight: 850; letter-spacing: -0.5px; }
        .profile-id { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; font-family: monospace; }

        .menu-container { padding: 24px 20px; }
        .menu-list { background: var(--white); border-radius: 24px; overflow: hidden; border: 1px solid var(--border); }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            text-decoration: none;
            color: var(--primary);
            gap: 16px;
            transition: 0.2s;
            border-bottom: 1px solid var(--border);
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f8fafc; }

        .menu-icon {
            width: 40px;
            height: 40px;
            background: #f1f5f9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .menu-label { flex: 1; font-weight: 700; font-size: 0.95rem; }
        .chevron { color: #cbd5e1; }

        .nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            height: 64px; background: rgba(1, 22, 39, 0.98);
            border-radius: 20px; display: flex; align-items: center;
            justify-content: space-around; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 1000;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.5); text-decoration: none; flex: 1; transition: 0.2s; }
        .nav-link.active { color: var(--white); }
        .nav-link svg { width: 20px; height: 20px; }
        .nav-label { font-size: 0.65rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="avatar-container">
            <img id="userImg" src="https://placehold.co/200x200?text=..." class="avatar">
            <div class="verify-badge">✓</div>
        </div>
        <h2 class="profile-name" id="userName">Yuklanmoqda...</h2>
        <p class="profile-id" id="userId">ID: 00000000</p>
    </div>

    <div class="menu-container">
        <div class="menu-list">
            <a href="seller-products.html" class="menu-item">
                <div class="menu-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="11" y2="17"></line></svg>
                </div>
                <span class="menu-label">Mahsulotlar</span>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
            
            <a href="support.html" class="menu-item">
                <div class="menu-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <span class="menu-label">Qo'llab-quvvatlash</span>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>

            <a href="terms.html" class="menu-item">
                <div class="menu-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
                <span class="menu-label">Tizim shartlari</span>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
        </div>
    </div>

    <nav class="nav">
        <a href="seller-dashboard.html" class="nav-link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            <span class="nav-label">Asosiy</span>
        </a>
        <a href="seller-products.html" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="11" y2="17"></line></svg>
            <span class="nav-label">Mahsulotlar</span>
        </a>
        <a href="seller-profile.html" class="nav-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span class="nav-label">Profil</span>
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        
        function initProfile() {
            const user = tg.initDataUnsafe?.user;
            if(user) {
                document.getElementById('userName').innerText = `${user.first_name} ${user.last_name || ''}`;
                document.getElementById('userId').innerText = `ID: ${user.id}`;
                if(user.photo_url) {
                    document.getElementById('userImg').src = user.photo_url;
                }
            }
        }

        document.querySelectorAll('.menu-item, .nav-link').forEach(el => {
            el.addEventListener('click', () => tg.HapticFeedback.impactOccurred('light'));
        });

        tg.ready();
        tg.expand();
        initProfile();
    </script>
</body>
</html>
