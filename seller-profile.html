<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sotuvchi profili</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #011627;
            --accent: #3a86ff;
            --premium: #ffb703;
            --premium-grad: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            --bg: #f8f9fa;
            --white: #ffffff;
            --text-muted: #64748b;
            --border: rgba(0,0,0,0.05);
            --danger: #ef4444;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background: var(--bg); font-family: -apple-system, system-ui, sans-serif; color: var(--primary); padding-bottom: 110px; }

        .profile-header {
            background: var(--white);
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 32px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            position: relative;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 35px;
            object-fit: cover;
            border: 4px solid #f0f7ff;
        }

        .verify-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--white);
            box-shadow: 0 4px 10px rgba(58, 134, 255, 0.3);
        }
        .verify-badge.active { display: flex; background: var(--premium-grad); }

        .profile-name { font-size: 1.4rem; font-weight: 850; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .profile-id { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; font-family: monospace; }

        .sub-status {
            margin-top: 15px;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .sub-active { background: #f0fdf4; color: #16a34a; }
        .sub-warning { background: #fef2f2; color: var(--danger); animation: pulse 2s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .menu-container { padding: 20px; }
        .menu-list { background: var(--white); border-radius: 24px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 15px; }

        .menu-item {
            display: flex; align-items: center; padding: 18px 20px; text-decoration: none; color: var(--primary); gap: 16px;
            border-bottom: 1px solid var(--border); transition: 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f8fafc; }

        .menu-icon { width: 40px; height: 40px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--accent); }
        .menu-label { flex: 1; font-weight: 700; font-size: 0.95rem; }
        .premium-tag { background: var(--premium-grad); color: white; padding: 2px 8px; border-radius: 8px; font-size: 0.65rem; }

        .nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px; height: 64px; background: rgba(1, 22, 39, 0.98);
            border-radius: 20px; display: flex; align-items: center; justify-content: space-around; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 1000;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.5); text-decoration: none; flex: 1; }
        .nav-link.active { color: var(--white); }
        .nav-label { font-size: 0.65rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="avatar-container">
            <img id="userImg" src="https://placehold.co/200x200?text=Profile" class="avatar">
            <div id="vBadge" class="verify-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
        </div>
        <h2 class="profile-name" id="userName">Sotuvchi</h2>
        <p class="profile-id" id="userId">ID: 00000000</p>
        <div id="subStatusBox"></div>
    </div>

    <div class="menu-container">
        <div class="menu-list">
            <a href="premium-info.html" class="menu-item" id="premiumMenu">
                <div class="menu-icon" style="background:#fff8e1; color:#fb8500;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"></path></svg>
                </div>
                <span class="menu-label">Premium tarif</span>
                <span class="premium-tag" id="premTag">Sotib olish</span>
            </a>
            
            <a href="seller-products.html" class="menu-item">
                <div class="menu-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>
                </div>
                <span class="menu-label">Mahsulotlarim</span>
            </a>

            <a href="support.html" class="menu-item">
                <div class="menu-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <span class="menu-label">Qo'llab-quvvatlash</span>
            </a>
        </div>
    </div>

    <nav class="nav">
        <a href="seller-dashboard.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span class="nav-label">Asosiy</span></a>
        <a href="seller-products.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line></svg><span class="nav-label">Mahsulotlar</span></a>
        <a href="seller-profile.html" class="nav-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span class="nav-label">Profil</span></a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const isPremium = localStorage.getItem('isPremium') === 'true';

        async function checkSub() {
            try {
                const res = await fetch('https://api.loopa.buzz/api/subscriptions/info', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const result = await res.json();
                if(result.success && result.data) {
                    const expiry = new Date(result.data);
                    const today = new Date();
                    const diffTime = expiry - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    const box = document.getElementById('subStatusBox');
                    if(diffDays > 0) {
                        const isUrgent = diffDays <= 3;
                        box.innerHTML = `<div class="sub-status ${isUrgent ? 'sub-warning' : 'sub-active'}">
                            ${isUrgent ? '⚠️ Obuna tugamoqda:' : '✅ Obuna faol:'} ${diffDays} kun qoldi
                        </div>`;
                        if(isUrgent) {
                            document.getElementById('premTag').innerText = "Yangilash";
                            tg.HapticFeedback.notificationOccurred('warning');
                        } else {
                            document.getElementById('premTag').innerText = "Faol";
                        }
                    }
                }
            } catch(e) {}
        }

        function init() {
            const user = tg.initDataUnsafe?.user;
            if(user) {
                document.getElementById('userName').innerText = user.first_name;
                document.getElementById('userId').innerText = `ID: ${user.id}`;
                if(user.photo_url) document.getElementById('userImg').src = user.photo_url;
            }
            if(isPremium) {
                document.getElementById('vBadge').classList.add('active');
                checkSub();
            }
        }

        tg.ready(); tg.expand(); init();
    </script>
</body>
</html>
